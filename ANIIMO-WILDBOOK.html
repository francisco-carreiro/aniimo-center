.dex-comparison{margin-top:17px;padding:14px;background:#192f3c;border:1px solid #3b6471;border-radius:11px}.dex-comparison h4{font-size:15px;margin:8px 0 10px}.dex-comparison>small{display:block;color:#849daf;font-size:9px;margin-top:10px;line-height:1.6}.dex-element-delta{display:flex;flex-wrap:wrap;gap:7px}.dex-element-delta span{padding:8px;border:1px solid #38546e;border-radius:7px;font-size:10px;color:#a5c9dd;background:#1b3148}.dex-delta-caption{color:#95e8ed;font-size:11px;margin:10px 0}.dex-delta-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:13px}.dex-delta{background:#142639;border:1px solid #305063;border-radius:7px;text-align:center;padding:10px 3px}.dex-delta small{display:block;color:#9db4c8;font-size:9px}.dex-delta strong{display:block;font-size:19px;margin-top:5px;color:#c3d2db}.dex-delta.up strong{color:#77f0c8}.dex-delta.down strong{color:#ffab9f}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ANIIMO CENTER · EXPEDITION EDITION / V1.3
   Distinctive cinematic front-end, lightweight native interactions.
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg:#090b12;--bg2:#0f111c;--panel:#161927;--panel2:#191e2c;
  --edge:#303342;--text:#f8f5f5;--muted:#a19daa;
  --cyan:#ff748c;--violet:#bd99ec;--accent:#ff657e;
  --shadow:0 24px 72px #02030960;
  --display:'Space Grotesk',system-ui,sans-serif;
  --font:'DM Sans',system-ui,sans-serif;
}
html{scroll-padding-top:104px}
body{background:#090b12;color:var(--text)}
body::selection{background:#ff657e;color:#fff}
body .app-shell{display:block;min-height:100vh}
body .main-area{background:radial-gradient(ellipse 65% 23% at 97% -8%,#6a2c5040,transparent),radial-gradient(ellipse 65% 55% at 0 54%,#25204726,transparent),#090b12;min-height:100vh}
body button:focus-visible,body a:focus-visible,body input:focus-visible{outline-color:#ff8b9f}
body .topbar{position:sticky;top:0;z-index:32;height:86px;padding:0 28px;background:#0c0d17ed;border-bottom:1px solid #ffffff15;backdrop-filter:blur(15px)}
body .topbar-inner{width:min(1536px,100%);height:100%;margin:auto;display:flex;align-items:center;gap:24px}
body .horizon-brand{flex:0 0 auto;display:flex;align-items:center;gap:13px;margin:0;padding:0;background:transparent;color:var(--text);border:0;min-width:207px;text-align:left}
body .horizon-brand .brand-mark{width:39px;height:39px;border-radius:13px;transform:rotate(-7deg);border:1px solid #ff8e9c5c;background:linear-gradient(155deg,#422838,#1a1825 80%);box-shadow:0 0 18px #ff697e19}
body .horizon-brand .brand-bolt{color:#ff8a9c;text-shadow:0 0 16px #ff677d9c;font-size:30px;transform:rotate(7deg)}
body .horizon-brand strong{font-size:17px;letter-spacing:-.04em;font-weight:800;white-space:nowrap}
body .horizon-brand strong span{color:#ff7891;margin-left:2px}
body .horizon-brand small{font-size:8px;color:#8f8b9c;letter-spacing:.17em;margin-top:3px}
.horizon-nav{display:flex;align-items:center;gap:3px;flex:1;justify-content:center;min-width:0}
.horizon-link{font-size:12px;white-space:nowrap;border:0;border-radius:9px;background:none;color:#a5a2b0;font-weight:750;padding:13px 11px;position:relative;transition:color .2s,background .2s}
.horizon-link:hover{background:#ffffff09;color:#fff}
.horizon-link.active{color:#fff;background:#ffffff0b}
.horizon-link.active:after{content:"";position:absolute;bottom:-19px;left:25%;right:25%;height:2px;border-radius:3px;background:#ff657e;box-shadow:0 0 15px #ff657e9b}
body .top-actions{flex:0 0 auto;gap:14px}
body .top-status{color:#858390;font-size:9px;white-space:nowrap;letter-spacing:.09em}
body .top-status i,.signal-dot{background:#ff7389;box-shadow:0 0 12px #ff738986;animation:breathe 3.6s ease-in-out infinite}
.collection-shortcut{display:flex;align-items:center;gap:10px;border:1px solid #ffffff22;border-radius:100px;background:#ffffff0a;color:#ede8ef;padding:10px 14px;font-weight:750;font-size:11px;white-space:nowrap;transition:border-color .2s,background .2s}
.collection-shortcut:hover,.collection-shortcut.active{border-color:#ff768c78;background:#ff768c12}
.collection-shortcut b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#ff718227;color:#ffa9b5}
.menu-trigger{display:none;background:#181a27;border:1px solid #363442;color:#faf4f7;border-radius:10px;padding:9px}
.mobile-drawer{display:none}
body main{width:min(1536px,100%);max-width:none;padding:55px clamp(23px,4vw,76px) 95px;margin:auto}
body:has(.cinematic-hero) main{padding-top:24px}
body .page-heading{margin-bottom:35px;padding-top:16px}
body .page-heading h1{font-size:clamp(42px,4.1vw,69px);letter-spacing:-.075em;line-height:1.04;font-weight:750;margin:15px 0}
body .page-heading h1 em{color:#ff788d}
body .page-heading p{max-width:740px;color:#a4a0af;line-height:1.75;font-size:13px}
body .eyebrow,body .section-kicker{color:#ef899a;letter-spacing:.17em;font-size:10px}
body .microline{background:#ff6d84}
body .btn{border-radius:10px;min-height:43px;font-size:11px;letter-spacing:.01em;font-weight:800;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
body .btn:hover{transform:translateY(-2px)}
body .btn.primary,body .btn.light{background:linear-gradient(120deg,#ff788b,#fd536d);border-color:#ff7a8e;color:#1c0b14;box-shadow:0 14px 34px #f64c681c}
body .btn.primary:hover,body .btn.light:hover{box-shadow:0 17px 40px #f64c6847}
body .btn.outline{background:#ffffff09;border:1px solid #ffffff30;color:#f8f3f5}
body .btn.outline:hover{background:#ffffff15;border-color:#ff839a77}
body .btn.secondary,body .btn.subtle{background:#23222d;border-color:#42404b;color:#f4eef2}
body .btn.ghost-link,body .btn.ghost{border-color:#ffffff35;color:#e5dfe7}
body .btn:active{transform:translateY(0)}
body .page-footer{width:min(1536px,100%);margin:auto;padding:35px clamp(23px,4vw,76px);background:none;border-top:1px solid #ffffff17;align-items:center;color:#8f8b9c}
.footer-brand{font-size:14px;color:#fff;font-weight:850;letter-spacing:-.04em}
.footer-brand small{font-size:8px;display:block;color:#9f909c;margin-top:5px;letter-spacing:.15em}
.footer-link{border:0;background:transparent;color:#e6c1ca;font-size:11px;display:flex;align-items:center;gap:8px}

/* Landing: visual storytelling, no dashboard tiles above the fold */
.cinematic-hero{border:1px solid #ffffff1f;min-height:650px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(106deg,#1d1826 2%,#141521 48%,#251626 100%);display:grid;grid-template-columns:54% 46%;box-shadow:inset 0 1px #ffffff13,0 30px 110px #0005}
.cinematic-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 38%,#e3609054,transparent 36%),radial-gradient(ellipse at 90% 110%,#504c9d35,transparent 48%),linear-gradient(160deg,#0000 48%,#00000044);pointer-events:none}
.cinematic-hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.20;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:92px 92px;mask-image:linear-gradient(90deg,transparent 25%,black)}
.hero-ambient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(128deg,transparent 35%,#ac567810 50%,transparent 63%)}
.hero-copy{z-index:3;position:relative;padding:clamp(50px,5.3vw,90px) 0 98px clamp(32px,5.2vw,87px);display:flex;flex-direction:column;align-items:flex-start}
.cinema-eyebrow{display:flex;align-items:center;gap:12px;letter-spacing:.16em;font-size:9px;font-weight:850;color:#e4cbd7;white-space:nowrap}
.cinema-eyebrow>i{height:7px;width:7px;border-radius:50%;background:#ff7789;box-shadow:0 0 15px #ff607f}
.eyebrow-line{height:1px;width:32px;background:#ffffff36}
.hero-copy h1{font-size:clamp(44px,5.1vw,87px);line-height:.98;letter-spacing:-.082em;font-weight:800;margin:35px 0 26px;text-wrap:balance;color:#fbf8fb}
.hero-copy h1 span{color:#ff778b;text-shadow:0 10px 52px #ff627e3f}
.hero-copy>p{color:#c0afbf;line-height:1.8;font-size:14px;max-width:490px}
.hero-copy .hero-buttons{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin:32px 0 0}
.hero-copy .hero-buttons .btn{font-size:12px;padding:14px 19px;min-height:51px}
.hero-footnote{display:flex;align-items:center;gap:10px;font-size:10px;color:#ae9ba9;margin-top:30px;flex-wrap:wrap}
.footnote-divider{display:inline-block;height:12px;width:1px;background:#ffffff33;margin:0 5px}
.hero-stage{min-width:0;position:relative;isolation:isolate;z-index:2}
.stage-ring{position:absolute;width:540px;height:540px;left:48%;top:43%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #ffcad62c;pointer-events:none}
.stage-ring.ring-one:before,.stage-ring.ring-two:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px dashed #ffffff20}
.stage-ring.ring-two{width:355px;height:355px;border-color:#ffb3c526;box-shadow:0 0 85px #ff86a317 inset}
.stage-sigil{position:absolute;top:36%;left:52%;font-size:240px;font-weight:900;color:#ff9cac08;transform:translate(-50%,-50%);pointer-events:none}
.stage-creature{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--text);transition:transform .35s ease;z-index:2}
.stage-creature:hover{transform:translateY(-8px) scale(1.035);z-index:6}
.stage-creature.figure-1{top:9%;left:18%;width:55%;height:52%;z-index:3}
.stage-creature.figure-2{top:42%;left:-4%;width:42%;height:43%}
.stage-creature.figure-3{top:46%;right:0;width:43%;height:41%}
.stage-art{display:grid;place-items:center;width:100%;height:78%;filter:drop-shadow(0 18px 34px #0006)}
.stage-creature .avatar.xl{width:min(100%,280px);height:min(100%,275px);border:0;box-shadow:none;background:transparent;border-radius:0;overflow:visible;filter:none}
.stage-creature .avatar.xl img{inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 15px #0008)}
.stage-creature .avatar.xl .avatar-halo,.stage-creature .avatar.xl .avatar-rune,.stage-creature .avatar.xl .avatar-initial{display:none}
.stage-creature .avatar.xl:not(.has-art){width:160px;height:160px;display:grid;place-items:center;background:radial-gradient(circle,#ffffff14,transparent 75%);border-radius:50%}
.stage-creature .avatar.xl:not(.has-art) .avatar-rune{display:block;opacity:.65}
.stage-label{display:flex;flex-direction:column;align-items:center;background:#151521b8;backdrop-filter:blur(10px);border:1px solid #ffffff24;border-radius:11px;padding:9px 16px;box-shadow:0 8px 25px #0004;min-width:127px;max-width:100%}
.stage-label small{color:#c0a1ae;font-size:8px;font-weight:850;letter-spacing:.14em}
.stage-label b{font-size:15px;margin:3px 0 5px;letter-spacing:-.03em}
.stage-label .element{font-size:8px;padding:2px 6px;min-height:auto}
.stage-coordinate{position:absolute;right:29px;bottom:64px;color:#bfa9b6;letter-spacing:.15em;font-size:9px}
.hero-bottom-line{position:absolute;bottom:0;left:0;right:0;height:45px;border-top:1px solid #ffffff21;background:#07071120;display:flex;justify-content:space-between;align-items:center;color:#b9a4b4;letter-spacing:.14em;font-size:9px;font-weight:800;padding:0 31px;z-index:4}
.scroll-mark{font-size:18px;line-height:1}
.stats-ribbon{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 33px;border-bottom:1px solid #ffffff18}
.stats-ribbon>div{display:flex;flex-direction:column;gap:3px}
.stats-ribbon strong{font-size:38px;color:#fff;line-height:1;letter-spacing:-.07em;font-weight:800}
.stats-ribbon strong span{color:#ff667e;font-size:23px;margin-left:2px}
.stats-ribbon small{font-size:9px;letter-spacing:.15em;font-weight:800;color:#8b8696}
.ribbon-link{display:flex;align-items:center;gap:13px;color:#f0b5c2;background:transparent;border:0;font-size:10px;font-weight:850;letter-spacing:.1em}
.experience-section{margin-top:105px}
.experience-heading{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:35px}
.experience-heading h2{font-size:clamp(30px,3.7vw,54px);line-height:1.15;letter-spacing:-.065em;margin:13px 0}
.experience-heading h2 em,.experience-cta h2 em{font-style:normal;color:#ff7c93}
.experience-heading p{color:#a9a2b0;line-height:1.7;max-width:610px;font-size:13px}
.section-index{font-size:11px;color:#817b8e;letter-spacing:.16em}
.feature-paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.feature-path{min-height:265px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;text-align:left;padding:25px;border:1px solid #ffffff1f;background:linear-gradient(155deg,#1a1b2a,#12141f);border-radius:17px;color:#f7f2f7;position:relative;overflow:hidden;transition:transform .23s,border-color .23s,box-shadow .23s}
.feature-path:before{content:"";position:absolute;right:-68px;top:-105px;width:220px;height:220px;border:1px solid #ff92a52b;border-radius:50%;box-shadow:0 0 0 27px #ff92a509,0 0 0 55px #ff92a505;pointer-events:none}
.feature-path:hover{transform:translateY(-6px);border-color:#ff829b7b;box-shadow:0 24px 40px #0005}
.path-top{display:flex;align-items:start;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#ed8ca0;font-weight:800}
.path-top svg{color:#e4bbd1}
.path-content{display:flex;flex-direction:column;gap:10px}
.path-content strong{font-size:25px;line-height:1.15;letter-spacing:-.05em;max-width:260px}
.path-content small{color:#b2aabb;font-size:12px;line-height:1.6;max-width:315px}
.path-link{font-size:10px;font-weight:850;color:#ff9fb0;letter-spacing:.13em;display:flex;align-items:center;gap:12px}
.element-gallery{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.element-portrait{color:var(--text);border:1px solid #ffffff20;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tile) 13%,transparent),transparent 64%),#171825;min-width:0;border-radius:13px;min-height:162px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.element-portrait:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--tile) 65%,#ffffff50)}
.element-portrait-glow{position:absolute;inset:auto 15% -56px;aspect-ratio:1/1;filter:blur(26px);border-radius:50%;background:var(--tile);opacity:.15;pointer-events:none}
.element-big-symbol{font-size:40px;line-height:1.5;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--tile) 50%,transparent));color:var(--tile);margin-top:18px}
.element-details{display:flex;flex-direction:column;align-items:center;gap:7px}
.element-details strong{font-size:12px;font-weight:800}
.element-details small{display:flex;gap:3px;align-items:center;color:#bcb1c1;font-size:7px;white-space:nowrap;letter-spacing:.04em;font-weight:800}
.spotlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
body .team-preview{border:1px solid color-mix(in srgb,var(--team-tone) 27%,#ffffff19);background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--team-tone) 12%,transparent),transparent 60%),#171a29;border-radius:16px;padding:25px;min-height:320px;transition:transform .23s,border-color .23s}
body .team-preview:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--team-tone) 60%,#ffffff30)}
body .team-preview h3{font-size:25px;line-height:1.2;letter-spacing:-.04em}
body .team-preview p{color:#b0a6b6;line-height:1.68;font-size:11px;margin:13px 0 17px}
body .team-preview .preview-units{justify-content:space-between;gap:6px}
body .team-preview .preview-unit{flex:1;min-width:0}
body .team-preview .preview-unit>span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;font-size:10px}
body .team-preview .text-action{color:#ff9cb0}
.experience-cta{margin-top:95px;padding:40px 44px;display:flex;justify-content:space-between;gap:28px;align-items:center;border-radius:18px;border:1px solid #ff8a9d41;background:radial-gradient(ellipse at 92% 50%,#a0527444,transparent 53%),#201825}
.experience-cta h2{font-size:clamp(28px,3vw,43px);letter-spacing:-.06em;margin:11px 0}
.experience-cta p{font-size:12px;color:#bdacbc;max-width:600px;line-height:1.75}
.experience-cta>div:last-child{display:flex;gap:10px;flex-wrap:wrap}

/* The Aniidex is a creature gallery instead of a uniform report grid */
body .dex-status{border-radius:15px!important;border:1px solid #ffffff1f!important;background:linear-gradient(115deg,#231c2b,#171926)!important;gap:24px;padding:22px 26px;margin-bottom:22px}
body .dex-status-main p,body .dex-status-main a{color:#b0a5b4}
body .dex-status-main a{color:#ffa2b3}
body .dex-metrics strong{color:#ffb4c1}
body .dex-metrics>div{border-color:#ffffff19}
body .live-state{border-color:#ffffff24;background:#ffffff0b;color:#e9dbe3}
body .live-state.good{border-color:#c7859c44;color:#ffd0da;background:#ed7a9930}
body .live-state.good i{background:#ff8499}
body .library-toolbar,body .filter-head{background:#171a26;border:1px solid #ffffff20;border-radius:14px}
body input,body textarea,body select{background:#242331;border-color:#45404e;color:#fff}

body .toggle-filter{background:#252636;border-color:#403c50;color:#cdc2d0}
body .toggle-filter.on{border-color:#ff879b;color:#fff;background:#743a4d}
body .library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
body .dex-card{--card-element:#fa8191;display:flex;flex-direction:column;min-height:335px;border:1px solid #ffffff22;background:#1a1c2a;border-radius:16px;overflow:hidden;position:relative;transition:border-color .25s,transform .25s,box-shadow .25s}
body .dex-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--card-element) 55%,#ffffff25);box-shadow:0 23px 48px #0004}
body .dex-card .library-open{display:flex;flex:1;flex-direction:column;align-items:stretch;padding:0;min-height:0;isolation:isolate;text-align:left}
.dex-card-wash{position:absolute;inset:0 0 80px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--card-element) 23%,transparent),transparent 66%),linear-gradient(180deg,#22223312,#141523 100%)}
.card-topline{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:16px 16px 0;min-height:42px;color:#c7bac8;font-size:10px;letter-spacing:.13em;font-weight:850}
body .dex-prismana{background:#a87ada21;border-color:#a87ada65;color:#dfbeff;font-size:8px;border-radius:30px;padding:5px 8px}
.dex-art-wrap{flex:1;min-height:185px;display:grid;place-items:center;position:relative;padding:4px 23px 0}
.dex-art-wrap:after{content:"";position:absolute;bottom:8px;width:53%;height:13px;border-radius:50%;background:#0008;filter:blur(11px);z-index:-1}

 ${formCompare(a,f)}<h3 class="sheet-section">Skills · ${f.skills.length}</h3>${skillblock}
 <h3 class="sheet-section">Traits · ${f.traits.length}</h3>${f.traits.length?`<div class="dex-traits">${f.traits.map(t=>`<div><strong>${safe(t.name)}</strong>${t.description?`<p>${safe(t.description)}</p>`:''}</div>`).join('')}</div>`:'<p class="muted">No traits reported for this form.</p>'}
 <div class="dex-facts"><div><strong>HABITATS</strong><p>${safe(f.habitats.join(' · ')||'Not published')}</p></div><div><strong>EVOLUTION TARGETS</strong><p>${safe(o.evolution.join(' · ')||'Not published')}</p></div></div></section>`;
}
function buildDetail(name){const a=getAniimo(name);if(!a)return '';const b=getBuild(a),record=state.collection[name],r=ROLE_PRIORITIES[a.role]||ROLE_PRIORITIES.Support;const count=a.official?.forms?.length||0;return `<div class="build-overlay" data-close="modal"><section class="build-sheet" role="dialog" aria-modal="true" aria-label="${safe(name)} field guide"><div class="sheet-bar"><span><span class="modal-serial">Aniimo Wildbook</span> / BUILD IDEA / ${safe(a.name).toUpperCase()}</span><button class="close-btn" data-close="modal" aria-label="Close Aniimo details">${icon('x',22)}</button></div><div class="dossier-layout"><aside class="dossier-poster" style="--sheet-tone:${getElement(a.element).tone}"><div class="poster-halo"></div><div class="poster-orbit"></div><span class="poster-overline">COMPANION PROFILE <span>/${safe(a.official?.id||'—')}</span></span><div class="poster-art">${avatar(a,'xl')}</div><div class="poster-caption">${elBadge(a.element)} <span>${safe(a.role)}</span></div><h2>${safe(a.name)}</h2><p>${count?`${count} documented ${count===1?'form':'forms'} · `:''}${safe(b.quality)}</p><button class="btn ${record?.owned?'outline':'primary'}" data-owned="${safe(name)}">${icon(record?.owned?'check':'plus',16)} ${record?.owned?'In my collection · Remove':'Add to my collection'}</button><small class="poster-legal">Your companions, your adventure.</small></aside><div class="sheet-scroll"><div class="dossier-intro"><span class="section-kicker">THE WILDBOOK / EVERY FORM</span><h3>Explore every <em>side.</em></h3><p>Discover a companion’s forms, abilities, elements, habitats and growth paths. Every form has a story to tell.</p></div>${officialDetail(a)}<section class="dossier-build"><span class="section-kicker">GROW TOGETHER</span><h3 class="sheet-section">Your <em>build guide.</em></h3><p class="sheet-intro">${safe(b.notes)}</p><div class="build-facts"><div><small>HELD ITEM</small><strong>${safe(b.item)}</strong><span>Alternative: ${safe(b.altItem)}</span></div><div><small>AWAKENING ORDER</small><strong>${safe(b.stats.join(' → '))}</strong><span>${safe(b.third)}</span></div><div><small>PERSONALITY</small><strong>${safe(b.personality)}</strong><span>${safe(b.form)}</span></div><div><small>ACTIVE SKILLS</small><strong>${b.skills.length?b.skills.map(safe).join(' + '):'Not individually verified'}</strong><span>${b.innate?'Innate: '+safe(b.innate):'Check current in-game loadout'}</span></div></div><h3 class="sheet-section">Battle plan</h3><p class="detail-description">${safe(b.rotation)}</p><h3 class="sheet-section">Investment priorities</h3><div class="policy-line">${icon('chart',18)}<p>${safe(r.explain)} <strong>${safe(r.avoid)}</strong></p></div></section>${personalPanel(name)}</div></div></section></div>`}

// Transparency-focused checklist; it is not a computed DPS, win rate, or performance prediction.
function gradeTeam(names){const selected=names.map(getAniimo).filter(Boolean);const ref=TEAMS.find(t=>t.element===state.target);const roles=selected.map(a=>ref?.lineup.find(([name])=>name===a.name)?.[1]||a.role);const uniq=new Set(selected.map(a=>a.name));let issues=[];let pts=0;if(roles.includes('DPS'))pts+=20;else issues.push('No primary DPS');if(roles.includes('Break'))pts+=20;else issues.push('No dedicated breaker (some supports can BREAK)');if(roles.includes('Regen'))pts+=20;else issues.push('No REGEN role');if(roles.includes('Heal'))pts+=15;else issues.push('No dedicated healer');if(roles.includes('Support'))pts+=10;else issues.push('No explicit support role');pts+=Math.round(selected.length/4*10);if(uniq.size!==selected.length){issues.push('Duplicate Aniimo selected');pts=Math.max(0,pts-15)}let own=selected.filter(a=>owned(a.name)).length;pts+=Math.round(own/4*5);return {pts:Math.min(100,pts),issues,selected,own}}
function planner(){let lineup=state.teamNames.map(n=>n||'');let current=gradeTeam(lineup);const rec=TEAMS.find(t=>t.element===state.target)||TEAMS[0];return `${title('BUILD ENGINE / 004','Squad <em>optimizer.</em>','Plan a four-Aniimo composition, check roles and ownership, then compare it with research-backed team templates.',button('Discover Aniimo','aniidex','btn subtle','book'))}<div class="planner-head"><div><span class="section-kicker">SQUAD BUILDER</span><h2>Forge your four-member team</h2><p>Composition health scores reflect roles and collection readiness — not predicted combat damage.</p></div><div class="select-wrap large"><label for="team-preset">TEAM PRESET</label><select id="team-preset">${TEAMS.map(t=>`<option value="${t.element}" ${t.element===state.target?'selected':''}>${t.element} · ${t.name}</option>`).join('')}</select></div></div><div class="planner-layout"><div><section class="planner-canvas"><div class="planner-top"><span>ACTIVE SQUAD <i>4 SLOTS</i></span><button class="mini-link" data-load-team="${state.target}">${icon('refresh',15)} Load ${safe(state.target)} recommendation</button></div><div class="planner-slots">${[0,1,2,3].map((i)=>{const name=lineup[i],a=getAniimo(name),el=a?getElement(a.element):null;return `<div class="planner-slot"><div class="slot-top"><span>0${i+1} / ${['CARRY','SUPPORT','UTILITY','FLEX'][i]}</span>${name&&owned(name)?'<span class="slot-owned">OWNED</span>':''}</div><div class="slot-avatar">${a?avatar(a,'lg'):`<span class="slot-empty">${icon('plus',30)}</span>`}</div><select class="slot-select" data-slot="${i}" aria-label="Select team slot ${i+1}"><option value="">Select Aniimo...</option>${ANIIMO.map(u=>`<option value="${safe(u.name)}" ${name===u.name?'selected':''}>${safe(u.name)}${owned(u.name)?' ✓':''}</option>`).join('')}</select>${a?`<div class="slot-roles">${elBadge(a.element,true)} <span>${safe(a.role)}</span></div>`:`<div class="slot-roles">OPEN SLOT</div>`}</div>`}).join('')}</div><div class="planner-actions"><button class="btn primary" data-analyze="team">${icon('chart',17)} Analyze composition</button><button class="btn secondary" data-clear="team">${icon('refresh',16)} Reset squad</button></div></section><section class="content-card tactical-panel"><span class="section-kicker">TEAM INSPIRATION</span><h3>${safe(rec.name)}</h3><p>${safe(rec.summary)}</p><div class="horizontal-members">${rec.lineup.map(([name,role])=>`<div>${avatar(getAniimo(name),'sm')}<span><strong>${safe(name)}</strong><small>${safe(role)}</small></span></div>`).join('')}</div><button class="text-action" data-team="${safe(rec.element)}">See full ${safe(rec.element)} strategy ${icon('arrow',15)}</button></section></div><div><div class="analysis-card"><div class="analysis-head"><span class="section-kicker">COMPOSITION CHECKLIST</span><span class="heuristic-badge">HEURISTIC</span></div><div class="analysis-score"><div class="score-ring" style="--score:${current.pts}"><div><strong>${current.pts}</strong><span>/100</span></div></div><div><h3>${current.pts>=80?'Well-rounded roles':current.pts>=55?'Some role gaps':'Needs revision'}</h3><p>Role coverage + owned readiness</p></div></div><div class="analysis-divider"></div><div class="analysis-row"><span>DPS carry</span><strong class="${current.selected.some(a=>a.role==='DPS')?'positive':'negative'}">${current.selected.some(a=>a.role==='DPS')?'COVERED':'MISSING'}</strong></div><div class="analysis-row"><span>BREAK</span><strong class="${current.selected.some(a=>a.role==='Break')?'positive':'negative'}">${current.selected.some(a=>a.role==='Break')?'COVERED':'REVIEW'}</strong></div><div class="analysis-row"><span>Energy / REGEN</span><strong class="${current.selected.some(a=>a.role==='Regen')?'positive':'negative'}">${current.selected.some(a=>a.role==='Regen')?'COVERED':'MISSING'}</strong></div><div class="analysis-row"><span>Healing</span><strong class="${current.selected.some(a=>a.role==='Heal')?'positive':'negative'}">${current.selected.some(a=>a.role==='Heal')?'COVERED':'OPTIONAL'}</strong></div><div class="analysis-row"><span>Owned members</span><strong>${current.own} / 4</strong></div><div class="analysis-alert">${icon('alert',18)}<span>${current.issues.length?safe(current.issues[0]):'All major checklist criteria covered. Confirm elemental weaknesses manually.'}</span></div><p class="analysis-disclaimer">This is a transparent composition checklist, not a DPS simulator. Team forms can change combat roles and elemental coverage.</p></div><div class="content-card about-awakening"><span class="section-kicker">UPGRADE INTELLIGENCE</span><h3>Maximize your resources</h3><p>Role-first investment, then specific skill scaling. Stat breakpoints commonly occur at total Potential 4, 8, 12, 16 and 20.</p><div class="priority-list">${[['DPS','ATK → REGEN'],['BREAK','BREAK → REGEN'],['REGEN','REGEN'],['HEAL','HP'],['SUPPORT','Trait-dependent']].map(([role,prio])=>`<div><span>${role}</span><strong>${prio}</strong></div>`).join('')}</div><div class="tiny-advisory">${icon('info',17)} Reset restrictions above Lv. 60 are reported in current guide data; check in game before spending.</div></div></div></div>`}
function collection(){const records=ANIIMO.filter(a=>owned(a.name));const l60=records.filter(a=>(state.collection[a.name].level||1)>=60).length;return `${title('PERSONAL VAULT / 005','My <em>collection.</em>','Track your actual roster, progression, held items and awakenings. Data stays in this browser until you export it.',`<button class="btn secondary" data-action="export">${icon('download',17)} Export JSON</button><button class="btn primary" data-action="import">${icon('upload',17)} Import JSON</button>`) }<div class="vault-stats"><div>${icon('layers',22)}<div><small>OWNED ANIIMO</small><strong>${records.length}<em> / ${ANIIMO.length}</em></strong></div></div><div>${icon('spark',22)}<div><small>LEVEL 60+</small><strong>${l60}</strong></div></div><div>${icon('target',22)}<div><small>TRACKED BUILDS</small><strong>${records.filter(a=>Object.keys(BUILDS).includes(a.name)).length}</strong></div></div><div>${icon('shield',22)}<div><small>STORAGE</small><strong class="storage-label">LOCAL ONLY</strong></div></div></div><div class="section-heading"><div><span class="section-kicker">YOUR UNITS</span><h2>Collection registry</h2></div>${button('Add Aniimo','aniidex','btn subtle','plus')}</div>${records.length?`<div class="collection-grid">${records.map(a=>{let p=state.collection[a.name];return `<div class="collection-card">${avatar(a,'lg')}<div class="collection-body"><div class="collection-title"><h3>${safe(a.name)}</h3>${elBadge(a.element,true)}</div>${p.form?`<div class="dex-collection-form">${safe(p.form)} form</div>`:''}<div class="collection-stats"><span>LEVEL <strong>${n(p.level,1,100,1)}</strong></span><span>CP <strong>${n(p.cp,0,999999,0).toLocaleString('en-US')}</strong></span><span>STAR <strong>${n(p.star,0,12,0)}</strong></span></div><div class="collection-actions"><button class="btn secondary" data-open="${safe(a.name)}">${icon('edit',16)} Edit profile</button><button class="icon-button" data-owned="${safe(a.name)}" title="Remove from collection">${icon('x',18)}</button></div></div></div>`}).join('')}</div>`:`<div class="empty-state">${icon('layers',30)}<h3>Your vault is empty</h3><p>Add Aniimo from the library and their builds will appear here.</p>${button('Browse library','aniidex','btn primary')}</div>`}<section class="data-actions"><div><span class="section-kicker">BACKUP & PORTABILITY</span><h3>Own your progression data</h3><p>Export anytime to move between your PC and phone. The app never uploads your collection to a server.</p></div><div><button class="btn secondary" data-action="export">${icon('download',16)} Download backup</button><button class="btn danger" data-action="reset">${icon('refresh',16)} Reset collection</button></div></section>`}
function render(keepScroll=false){const was=window.scrollY;document.querySelectorAll('.build-overlay').forEach(el=>el.remove());app.innerHTML=header()+({overview,teams:teamsPage,aniidex:library,items:itemsPage,progression,planner,collection}[state.nav]||overview)()+footer();if(modal){document.body.insertAdjacentHTML('beforeend',buildDetail(modal));document.body.classList.add('modal-open')}else{document.body.classList.remove('modal-open')}if(keepScroll)requestAnimationFrame(()=>window.scrollTo(0,was));else requestAnimationFrame(()=>window.scrollTo(0,0))}
function navigate(page){state.nav=page;document.body.classList.remove('menu-open');render();persist()}
function openBuild(name){if(!getAniimo(name))return;modal=name;render(true)}
function closeBuild(){modal=null;document.querySelector('.build-overlay')?.remove();document.body.classList.remove('modal-open');render(true)}
function toggleOwned(name){if(!getAniimo(name))return;if(owned(name)){delete state.collection[name];flash(`${name} removed from collection.`)}else{state.collection[name]=clone(DEFAULT_PROFILE);flash(`${name} added to collection.`)}persist();render(true)}
function saveProfile(name){const dialog=document.querySelector('.build-sheet');if(!dialog)return;const base=clone(state.collection[name]||DEFAULT_PROFILE);dialog.querySelectorAll('[data-profile]').forEach(input=>{if(input.dataset.awaken)base.awaken[input.dataset.awaken]=n(input.value,0,20,0);else {const k=input.dataset.field;if(['level','cp','star','spent','budget'].includes(k))base[k]=n(input.value,k==='level'?1:0,k==='cp'?999999:k==='level'?100:200);else base[k]=input.value.slice(0,k==='notes'?400:120)}});base.owned=true;if(base.spent>base.budget){flash('Spent exceeds budget — check your game screenshot.','warn');return}state.collection[name]=base;persist();flash(`${name} progression saved.`);render(true)}
function loadTeam(ele){const t=TEAMS.find(x=>x.element===ele)||TEAMS[0];state.target=t.element;state.teamNames=t.lineup.map(x=>x[0]);persist();navigate('planner');flash(`${t.element} team loaded in planner.`)}
function swapTeam(value){const [element,outN,inN,form]=value.split('|');const t=TEAMS.find(x=>x.element===element);if(!t)return;state.target=element;state.teamNames=t.lineup.map(x=>x[0]===outN?inN:x[0]);navigate('planner');flash(`${outN} swapped for ${inN}${form&&form!=='Basic'?' ('+form+')':''}.`)}
function downloadBackup(){const obj={format:'aniimo-center',version:1,exportedAt:new Date().toISOString(),collection:state.collection,favorite:state.favorite};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='aniimo-center-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);flash('Backup exported successfully.')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{if(file.size>2500000)throw new Error('File is too large');const b=JSON.parse(String(reader.result));if(b.format!=='aniimo-center'||b.version!==1||!b.collection||typeof b.collection!=='object'||Array.isArray(b.collection))throw new Error('Not a valid Aniimo Wildbook backup');const cleaned={};Object.entries(b.collection).forEach(([name,p])=>{if(typeof name!=='string'||!name.trim()||name.length>100||!p||typeof p!=='object'||Array.isArray(p))return;cleaned[name]={...clone(DEFAULT_PROFILE),owned:true,level:n(p.level,1,100,1),cp:n(p.cp,0,999999,0),star:n(p.star,0,12,0),spent:n(p.spent,0,200,0),budget:n(p.budget,0,200,5),potential:String(p.potential||'Unknown').slice(0,50),held:String(p.held||'').slice(0,120),notes:String(p.notes||'').slice(0,400),form:String(p.form||'Basic').slice(0,120),awaken:Object.fromEntries(STAT_NAMES.map(st=>[st,n(p.awaken?.[st],0,20,0)]))}});state.collection=cleaned;persist();render(true);flash(`Imported ${Object.keys(cleaned).length} owned Aniimo.`)}catch(err){flash('Import failed: '+err.message,'warn')}};reader.readAsText(file)}
const uploader=document.createElement('input');uploader.type='file';uploader.accept='application/json,.json';uploader.hidden=true;document.body.appendChild(uploader);uploader.addEventListener('change',e=>{importBackup(e.target.files[0]);uploader.value=''})
document.addEventListener('click',e=>{const target=e.target.closest('button,a,[data-close],[data-toggle]');if(!target)return;if(target.dataset.formName){activeFormByName.set(target.dataset.formName,target.dataset.formId);render(true);return}if(target.dataset.action==='refresh-dex'){refreshCatalog(true);return}if(target.dataset.close){if(e.target===target||target.tagName==='BUTTON')closeBuild();return}if(target.dataset.toggle==='menu'){const open=document.body.classList.toggle('menu-open');document.querySelector('.menu-trigger')?.setAttribute('aria-expanded',String(open));return}if(target.dataset.toggle==='roster-owned'){state.rosterOwned=!state.rosterOwned;render(true);return}if(target.dataset.nav){navigate(target.dataset.nav);return}if(target.dataset.open){openBuild(target.dataset.open);return}if(target.dataset.team){state.target=target.dataset.team;navigate('teams');return}if(target.dataset.owned){toggleOwned(target.dataset.owned);return}if(target.dataset.loadTeam){loadTeam(target.dataset.loadTeam);return}if(target.dataset.swap){swapTeam(target.dataset.swap);return}if(target.dataset.teamOwned){const t=TEAMS.find(x=>x.element===target.dataset.teamOwned);let count=0;t?.lineup.forEach(([name])=>{if(!owned(name)){state.collection[name]=clone(DEFAULT_PROFILE);count++}});persist();render(true);flash(count?`${count} Aniimo added to collection.`:'All team members already owned.');return}if(target.dataset.saveProfile){saveProfile(target.dataset.saveProfile);return}if(target.dataset.analyze){flash('Role checklist updated from your selected lineup.');return}if(target.dataset.clear==='team'){state.teamNames=['','','',''];persist();render(true);return}if(target.dataset.clear==='filters'){state.rosterQuery='';state.rosterFilter='All';state.rosterOwned=false;state.formFilter='All';render(true);return}if(target.dataset.action==='export'){downloadBackup();return}if(target.dataset.action==='import'){uploader.click();return}if(target.dataset.action==='reset'){if(window.confirm('Clear the entire ANIIMO collection stored in this browser? Export a backup first.')){state.collection={};persist();render();flash('Collection reset.')}}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='roster-element'){state.rosterFilter=t.value;render(true)}if(t.id==='roster-form'){state.formFilter=t.value;render(true)}if(t.id==='progress-select'){state.selected=t.value;persist();render(true)}if(t.id==='team-preset'){state.target=t.value;state.teamNames=(TEAMS.find(a=>a.element===t.value)||TEAMS[0]).lineup.map(x=>x[0]);persist();render(true)}if(t.dataset.slot!==undefined){state.teamNames[Number(t.dataset.slot)]=t.value;persist();render(true)}});
document.addEventListener('input',e=>{if(e.target.id==='roster-search'){let active=e.target,idx=active.selectionStart;state.rosterQuery=active.value;const grid=document.querySelector('.library-grid');const summary=document.querySelector('.library-summary');if(!grid)return;let filtered=filterAniimo();grid.querySelectorAll('.library-card').forEach(card=>{const name=card.querySelector('[data-open]')?.dataset.open;card.style.display=filtered.some(a=>a.name===name)?'':'none'});if(summary)summary.querySelector('b').textContent=filtered.length;const emp=document.querySelector('.library-empty-search');if(emp)emp.remove();if(!filtered.length)grid.insertAdjacentHTML('afterend','<p class="library-empty-search muted">No matching Aniimo. Try a different search.</p>')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeBuild();document.body.classList.remove('menu-open')}});
async function refreshCatalog(refresh=false){catalog.status='loading';catalog.error='';if(state.nav==='aniidex')render(true);const result=await loadPublicCatalog({refresh});catalog.status='ready';catalog.mode=result.mode;catalog.items=result.items;catalog.cachedAt=result.cachedAt;catalog.error=result.error||'';if(result.items.length)applyPublicCatalog(result.items,ANIIMO);render(true);if(refresh)flash(result.items.length?`Your Wildbook has ${result.items.length} companions to discover.`:'More companions could not be loaded. Your saved Wildbook is ready.',result.items.length?'info':'warn');}
render();
refreshCatalog();
</script></body></html>
