.dex-comparison{margin-top:17px;padding:14px;background:#192f3c;border:1px solid #3b6471;border-radius:11px}.dex-comparison h4{font-size:15px;margin:8px 0 10px}.dex-comparison>small{display:block;color:#849daf;font-size:9px;margin-top:10px;line-height:1.6}.dex-element-delta{display:flex;flex-wrap:wrap;gap:7px}.dex-element-delta span{padding:8px;border:1px solid #38546e;border-radius:7px;font-size:10px;color:#a5c9dd;background:#1b3148}.dex-delta-caption{color:#95e8ed;font-size:11px;margin:10px 0}.dex-delta-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:13px}.dex-delta{background:#142639;border:1px solid #305063;border-radius:7px;text-align:center;padding:10px 3px}.dex-delta small{display:block;color:#9db4c8;font-size:9px}.dex-delta strong{display:block;font-size:19px;margin-top:5px;color:#c3d2db}.dex-delta.up strong{color:#77f0c8}.dex-delta.down strong{color:#ffab9f}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ANIIMO CENTER · EXPEDITION EDITION / V1.3
   Distinctive cinematic front-end, lightweight native interactions.
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg:#090b12;--bg2:#0f111c;--panel:#161927;--panel2:#191e2c;
  --edge:#303342;--text:#f8f5f5;--muted:#a19daa;
  --cyan:#ff748c;--violet:#bd99ec;--accent:#ff657e;
  --shadow:0 24px 72px #02030960;
  --display:'Space Grotesk',system-ui,sans-serif;
  --font:'DM Sans',system-ui,sans-serif;
}
html{scroll-padding-top:104px}
body{background:#090b12;color:var(--text)}
body::selection{background:#ff657e;color:#fff}
body .app-shell{display:block;min-height:100vh}
body .main-area{background:radial-gradient(ellipse 65% 23% at 97% -8%,#6a2c5040,transparent),radial-gradient(ellipse 65% 55% at 0 54%,#25204726,transparent),#090b12;min-height:100vh}
body button:focus-visible,body a:focus-visible,body input:focus-visible{outline-color:#ff8b9f}
body .topbar{position:sticky;top:0;z-index:32;height:86px;padding:0 28px;background:#0c0d17ed;border-bottom:1px solid #ffffff15;backdrop-filter:blur(15px)}
body .topbar-inner{width:min(1536px,100%);height:100%;margin:auto;display:flex;align-items:center;gap:24px}
body .horizon-brand{flex:0 0 auto;display:flex;align-items:center;gap:13px;margin:0;padding:0;background:transparent;color:var(--text);border:0;min-width:207px;text-align:left}
body .horizon-brand .brand-mark{width:39px;height:39px;border-radius:13px;transform:rotate(-7deg);border:1px solid #ff8e9c5c;background:linear-gradient(155deg,#422838,#1a1825 80%);box-shadow:0 0 18px #ff697e19}
body .horizon-brand .brand-bolt{color:#ff8a9c;text-shadow:0 0 16px #ff677d9c;font-size:30px;transform:rotate(7deg)}
body .horizon-brand strong{font-size:17px;letter-spacing:-.04em;font-weight:800;white-space:nowrap}
body .horizon-brand strong span{color:#ff7891;margin-left:2px}
body .horizon-brand small{font-size:8px;color:#8f8b9c;letter-spacing:.17em;margin-top:3px}
.horizon-nav{display:flex;align-items:center;gap:3px;flex:1;justify-content:center;min-width:0}
.horizon-link{font-size:12px;white-space:nowrap;border:0;border-radius:9px;background:none;color:#a5a2b0;font-weight:750;padding:13px 11px;position:relative;transition:color .2s,background .2s}
.horizon-link:hover{background:#ffffff09;color:#fff}
.horizon-link.active{color:#fff;background:#ffffff0b}
.horizon-link.active:after{content:"";position:absolute;bottom:-19px;left:25%;right:25%;height:2px;border-radius:3px;background:#ff657e;box-shadow:0 0 15px #ff657e9b}
body .top-actions{flex:0 0 auto;gap:14px}
body .top-status{color:#858390;font-size:9px;white-space:nowrap;letter-spacing:.09em}
body .top-status i,.signal-dot{background:#ff7389;box-shadow:0 0 12px #ff738986;animation:breathe 3.6s ease-in-out infinite}
.collection-shortcut{display:flex;align-items:center;gap:10px;border:1px solid #ffffff22;border-radius:100px;background:#ffffff0a;color:#ede8ef;padding:10px 14px;font-weight:750;font-size:11px;white-space:nowrap;transition:border-color .2s,background .2s}
.collection-shortcut:hover,.collection-shortcut.active{border-color:#ff768c78;background:#ff768c12}
.collection-shortcut b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#ff718227;color:#ffa9b5}
.menu-trigger{display:none;background:#181a27;border:1px solid #363442;color:#faf4f7;border-radius:10px;padding:9px}
.mobile-drawer{display:none}
body main{width:min(1536px,100%);max-width:none;padding:55px clamp(23px,4vw,76px) 95px;margin:auto}
body:has(.cinematic-hero) main{padding-top:24px}
body .page-heading{margin-bottom:35px;padding-top:16px}
body .page-heading h1{font-size:clamp(42px,4.1vw,69px);letter-spacing:-.075em;line-height:1.04;font-weight:750;margin:15px 0}
body .page-heading h1 em{color:#ff788d}
body .page-heading p{max-width:740px;color:#a4a0af;line-height:1.75;font-size:13px}
body .eyebrow,body .section-kicker{color:#ef899a;letter-spacing:.17em;font-size:10px}
body .microline{background:#ff6d84}
body .btn{border-radius:10px;min-height:43px;font-size:11px;letter-spacing:.01em;font-weight:800;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
body .btn:hover{transform:translateY(-2px)}
body .btn.primary,body .btn.light{background:linear-gradient(120deg,#ff788b,#fd536d);border-color:#ff7a8e;color:#1c0b14;box-shadow:0 14px 34px #f64c681c}
body .btn.primary:hover,body .btn.light:hover{box-shadow:0 17px 40px #f64c6847}
body .btn.outline{background:#ffffff09;border:1px solid #ffffff30;color:#f8f3f5}
body .btn.outline:hover{background:#ffffff15;border-color:#ff839a77}
body .btn.secondary,body .btn.subtle{background:#23222d;border-color:#42404b;color:#f4eef2}
body .btn.ghost-link,body .btn.ghost{border-color:#ffffff35;color:#e5dfe7}
body .btn:active{transform:translateY(0)}
body .page-footer{width:min(1536px,100%);margin:auto;padding:35px clamp(23px,4vw,76px);background:none;border-top:1px solid #ffffff17;align-items:center;color:#8f8b9c}
.footer-brand{font-size:14px;color:#fff;font-weight:850;letter-spacing:-.04em}
.footer-brand small{font-size:8px;display:block;color:#9f909c;margin-top:5px;letter-spacing:.15em}
.footer-link{border:0;background:transparent;color:#e6c1ca;font-size:11px;display:flex;align-items:center;gap:8px}

/* Landing: visual storytelling, no dashboard tiles above the fold */
.cinematic-hero{border:1px solid #ffffff1f;min-height:650px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(106deg,#1d1826 2%,#141521 48%,#251626 100%);display:grid;grid-template-columns:54% 46%;box-shadow:inset 0 1px #ffffff13,0 30px 110px #0005}
.cinematic-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 38%,#e3609054,transparent 36%),radial-gradient(ellipse at 90% 110%,#504c9d35,transparent 48%),linear-gradient(160deg,#0000 48%,#00000044);pointer-events:none}
.cinematic-hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.20;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:92px 92px;mask-image:linear-gradient(90deg,transparent 25%,black)}
.hero-ambient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(128deg,transparent 35%,#ac567810 50%,transparent 63%)}
.hero-copy{z-index:3;position:relative;padding:clamp(50px,5.3vw,90px) 0 98px clamp(32px,5.2vw,87px);display:flex;flex-direction:column;align-items:flex-start}
.cinema-eyebrow{display:flex;align-items:center;gap:12px;letter-spacing:.16em;font-size:9px;font-weight:850;color:#e4cbd7;white-space:nowrap}
.cinema-eyebrow>i{height:7px;width:7px;border-radius:50%;background:#ff7789;box-shadow:0 0 15px #ff607f}
.eyebrow-line{height:1px;width:32px;background:#ffffff36}
.hero-copy h1{font-size:clamp(44px,5.1vw,87px);line-height:.98;letter-spacing:-.082em;font-weight:800;margin:35px 0 26px;text-wrap:balance;color:#fbf8fb}
.hero-copy h1 span{color:#ff778b;text-shadow:0 10px 52px #ff627e3f}
.hero-copy>p{color:#c0afbf;line-height:1.8;font-size:14px;max-width:490px}
.hero-copy .hero-buttons{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin:32px 0 0}
.hero-copy .hero-buttons .btn{font-size:12px;padding:14px 19px;min-height:51px}
.hero-footnote{display:flex;align-items:center;gap:10px;font-size:10px;color:#ae9ba9;margin-top:30px;flex-wrap:wrap}
.footnote-divider{display:inline-block;height:12px;width:1px;background:#ffffff33;margin:0 5px}
.hero-stage{min-width:0;position:relative;isolation:isolate;z-index:2}
.stage-ring{position:absolute;width:540px;height:540px;left:48%;top:43%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #ffcad62c;pointer-events:none}
.stage-ring.ring-one:before,.stage-ring.ring-two:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px dashed #ffffff20}
.stage-ring.ring-two{width:355px;height:355px;border-color:#ffb3c526;box-shadow:0 0 85px #ff86a317 inset}
.stage-sigil{position:absolute;top:36%;left:52%;font-size:240px;font-weight:900;color:#ff9cac08;transform:translate(-50%,-50%);pointer-events:none}
.stage-creature{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--text);transition:transform .35s ease;z-index:2}
.stage-creature:hover{transform:translateY(-8px) scale(1.035);z-index:6}
.stage-creature.figure-1{top:9%;left:18%;width:55%;height:52%;z-index:3}
.stage-creature.figure-2{top:42%;left:-4%;width:42%;height:43%}
.stage-creature.figure-3{top:46%;right:0;width:43%;height:41%}
.stage-art{display:grid;place-items:center;width:100%;height:78%;filter:drop-shadow(0 18px 34px #0006)}
.stage-creature .avatar.xl{width:min(100%,280px);height:min(100%,275px);border:0;box-shadow:none;background:transparent;border-radius:0;overflow:visible;filter:none}
.stage-creature .avatar.xl img{inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 15px #0008)}
.stage-creature .avatar.xl .avatar-halo,.stage-creature .avatar.xl .avatar-rune,.stage-creature .avatar.xl .avatar-initial{display:none}
.stage-creature .avatar.xl:not(.has-art){width:160px;height:160px;display:grid;place-items:center;background:radial-gradient(circle,#ffffff14,transparent 75%);border-radius:50%}
.stage-creature .avatar.xl:not(.has-art) .avatar-rune{display:block;opacity:.65}
.stage-label{display:flex;flex-direction:column;align-items:center;background:#151521b8;backdrop-filter:blur(10px);border:1px solid #ffffff24;border-radius:11px;padding:9px 16px;box-shadow:0 8px 25px #0004;min-width:127px;max-width:100%}
.stage-label small{color:#c0a1ae;font-size:8px;font-weight:850;letter-spacing:.14em}
.stage-label b{font-size:15px;margin:3px 0 5px;letter-spacing:-.03em}
.stage-label .element{font-size:8px;padding:2px 6px;min-height:auto}
.stage-coordinate{position:absolute;right:29px;bottom:64px;color:#bfa9b6;letter-spacing:.15em;font-size:9px}
.hero-bottom-line{position:absolute;bottom:0;left:0;right:0;height:45px;border-top:1px solid #ffffff21;background:#07071120;display:flex;justify-content:space-between;align-items:center;color:#b9a4b4;letter-spacing:.14em;font-size:9px;font-weight:800;padding:0 31px;z-index:4}
.scroll-mark{font-size:18px;line-height:1}
.stats-ribbon{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 33px;border-bottom:1px solid #ffffff18}
.stats-ribbon>div{display:flex;flex-direction:column;gap:3px}
.stats-ribbon strong{font-size:38px;color:#fff;line-height:1;letter-spacing:-.07em;font-weight:800}
.stats-ribbon strong span{color:#ff667e;font-size:23px;margin-left:2px}
.stats-ribbon small{font-size:9px;letter-spacing:.15em;font-weight:800;color:#8b8696}
.ribbon-link{display:flex;align-items:center;gap:13px;color:#f0b5c2;background:transparent;border:0;font-size:10px;font-weight:850;letter-spacing:.1em}
.experience-section{margin-top:105px}
.experience-heading{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:35px}
.experience-heading h2{font-size:clamp(30px,3.7vw,54px);line-height:1.15;letter-spacing:-.065em;margin:13px 0}
.experience-heading h2 em,.experience-cta h2 em{font-style:normal;color:#ff7c93}
.experience-heading p{color:#a9a2b0;line-height:1.7;max-width:610px;font-size:13px}
.section-index{font-size:11px;color:#817b8e;letter-spacing:.16em}
.feature-paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.feature-path{min-height:265px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;text-align:left;padding:25px;border:1px solid #ffffff1f;background:linear-gradient(155deg,#1a1b2a,#12141f);border-radius:17px;color:#f7f2f7;position:relative;overflow:hidden;transition:transform .23s,border-color .23s,box-shadow .23s}
.feature-path:before{content:"";position:absolute;right:-68px;top:-105px;width:220px;height:220px;border:1px solid #ff92a52b;border-radius:50%;box-shadow:0 0 0 27px #ff92a509,0 0 0 55px #ff92a505;pointer-events:none}
.feature-path:hover{transform:translateY(-6px);border-color:#ff829b7b;box-shadow:0 24px 40px #0005}
.path-top{display:flex;align-items:start;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#ed8ca0;font-weight:800}
.path-top svg{color:#e4bbd1}
.path-content{display:flex;flex-direction:column;gap:10px}
.path-content strong{font-size:25px;line-height:1.15;letter-spacing:-.05em;max-width:260px}
.path-content small{color:#b2aabb;font-size:12px;line-height:1.6;max-width:315px}
.path-link{font-size:10px;font-weight:850;color:#ff9fb0;letter-spacing:.13em;display:flex;align-items:center;gap:12px}
.element-gallery{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.element-portrait{color:var(--text);border:1px solid #ffffff20;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tile) 13%,transparent),transparent 64%),#171825;min-width:0;border-radius:13px;min-height:162px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.element-portrait:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--tile) 65%,#ffffff50)}
.element-portrait-glow{position:absolute;inset:auto 15% -56px;aspect-ratio:1/1;filter:blur(26px);border-radius:50%;background:var(--tile);opacity:.15;pointer-events:none}
.element-big-symbol{font-size:40px;line-height:1.5;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--tile) 50%,transparent));color:var(--tile);margin-top:18px}
.element-details{display:flex;flex-direction:column;align-items:center;gap:7px}
.element-details strong{font-size:12px;font-weight:800}
.element-details small{display:flex;gap:3px;align-items:center;color:#bcb1c1;font-size:7px;white-space:nowrap;letter-spacing:.04em;font-weight:800}
.spotlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
body .team-preview{border:1px solid color-mix(in srgb,var(--team-tone) 27%,#ffffff19);background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--team-tone) 12%,transparent),transparent 60%),#171a29;border-radius:16px;padding:25px;min-height:320px;transition:transform .23s,border-color .23s}
body .team-preview:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--team-tone) 60%,#ffffff30)}
body .team-preview h3{font-size:25px;line-height:1.2;letter-spacing:-.04em}
body .team-preview p{color:#b0a6b6;line-height:1.68;font-size:11px;margin:13px 0 17px}
body .team-preview .preview-units{justify-content:space-between;gap:6px}
body .team-preview .preview-unit{flex:1;min-width:0}
body .team-preview .preview-unit>span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;font-size:10px}
body .team-preview .text-action{color:#ff9cb0}
.experience-cta{margin-top:95px;padding:40px 44px;display:flex;justify-content:space-between;gap:28px;align-items:center;border-radius:18px;border:1px solid #ff8a9d41;background:radial-gradient(ellipse at 92% 50%,#a0527444,transparent 53%),#201825}
.experience-cta h2{font-size:clamp(28px,3vw,43px);letter-spacing:-.06em;margin:11px 0}
.experience-cta p{font-size:12px;color:#bdacbc;max-width:600px;line-height:1.75}
.experience-cta>div:last-child{display:flex;gap:10px;flex-wrap:wrap}

/* The Aniidex is a creature gallery instead of a uniform report grid */
body .dex-status{border-radius:15px!important;border:1px solid #ffffff1f!important;background:linear-gradient(115deg,#231c2b,#171926)!important;gap:24px;padding:22px 26px;margin-bottom:22px}
body .dex-status-main p,body .dex-status-main a{color:#b0a5b4}
body .dex-status-main a{color:#ffa2b3}
body .dex-metrics strong{color:#ffb4c1}
body .dex-metrics>div{border-color:#ffffff19}
body .live-state{border-color:#ffffff24;background:#ffffff0b;color:#e9dbe3}
body .live-state.good{border-color:#c7859c44;color:#ffd0da;background:#ed7a9930}
body .live-state.good i{background:#ff8499}
body .library-toolbar,body .filter-head{background:#171a26;border:1px solid #ffffff20;border-radius:14px}
body input,body textarea,body select{background:#242331;border-color:#45404e;color:#fff}

body .toggle-filter{background:#252636;border-color:#403c50;color:#cdc2d0}
body .toggle-filter.on{border-color:#ff879b;color:#fff;background:#743a4d}
body .library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
body .dex-card{--card-element:#fa8191;display:flex;flex-direction:column;min-height:335px;border:1px solid #ffffff22;background:#1a1c2a;border-radius:16px;overflow:hidden;position:relative;transition:border-color .25s,transform .25s,box-shadow .25s}
body .dex-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--card-element) 55%,#ffffff25);box-shadow:0 23px 48px #0004}
body .dex-card .library-open{display:flex;flex:1;flex-direction:column;align-items:stretch;padding:0;min-height:0;isolation:isolate;text-align:left}
.dex-card-wash{position:absolute;inset:0 0 80px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--card-element) 23%,transparent),transparent 66%),linear-gradient(180deg,#22223312,#141523 100%)}
.card-topline{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:16px 16px 0;min-height:42px;color:#c7bac8;font-size:10px;letter-spacing:.13em;font-weight:850}
body .dex-prismana{background:#a87ada21;border-color:#a87ada65;color:#dfbeff;font-size:8px;border-radius:30px;padding:5px 8px}
.dex-art-wrap{flex:1;min-height:185px;display:grid;place-items:center;position:relative;padding:4px 23px 0}
.dex-art-wrap:after{content:"";position:absolute;bottom:8px;width:53%;height:13px;border-radius:50%;background:#0008;filter:blur(11px);z-index:-1}

function statistics(v) {

  const r = { HP:num(v.hp ?? v.HP), ATK:num(v.atk ?? v.ATK), BREAK:num(v.brk ?? v.break ?? v.BREAK), 'P.DEF':num(v.pdef ?? v.pDef ?? v['P.DEF']), 'M.DEF':num(v.mdef ?? v.mDef ?? v['M.DEF']), REGEN:num(v.regen ?? v.REGEN) };

function displayFormName(form, index) {

function normalizeForm(form, index, animal) {

    roles:roles(form.papeis ?? form.roles ?? form.papel ?? animal.papeis),

function normalizeAnimal(animal, index) {
  if (!isObject(animal)) return null;
  const name=string(animal.nome?.en ?? animal.name?.en ?? animal.nome ?? animal.name);
  if (!name) return null;
  const forms=arr(animal.formas ?? animal.forms).filter(isObject).map((f,i)=>normalizeForm(f,i,animal));
  if (!forms.length) forms.push(normalizeForm({nome:'Basic',stats:animal.stats,elementos:animal.elementos,papeis:animal.papeis,imagem:animal.imagem,skills:animal.skills,traits:animal.traits,locais:animal.locais},0,animal));

  const basic=forms.find(f=>/^basic$/i.test(f.name)) ?? forms[0];
  return {
    id:string(animal.id ?? animal.numero ?? index+1), slug:string(animal.slug), name,
    portuguese:string(animal.nome?.pt), description:string(animal.desc?.en ?? animal.descricao?.en ?? animal.desc ?? animal.description).slice(0,1000),
    elements:basic.elements, roles:basic.roles, forms, image:basic.image || forms.find(f=>f.image)?.image || '',

function normalizePublicCatalog(raw) {
  const list = Array.isArray(raw) ? raw : arr(raw?.aniimos ?? raw?.data?.aniimos ?? raw?.data ?? raw?.items ?? raw?.results);
  if (!Array.isArray(list)) return [];
  const unique=new Map();
  for(const [i,item] of list.entries()) {
    const record=normalizeAnimal(item,i);
    if(record && record.forms.length && !unique.has(record.name.toLowerCase())) unique.set(record.name.toLowerCase(),record);
  }
  return [...unique.values()].sort((a,b)=>Number(a.id)-Number(b.id)||a.name.localeCompare(b.name));
}
function readCache() {
  try { const cached=JSON.parse(localStorage.getItem(CACHE_NAME));
    if(cached?.version===2 && Array.isArray(cached.items) && cached.items.length>=30) return cached; }
  catch {} return null;
}
function saveCache(items) {
  try { localStorage.setItem(CACHE_NAME,JSON.stringify({version:2,time:Date.now(),items})); } catch {} // Quota/privacy mode: runtime still works
}
async function loadPublicCatalog({refresh=false,timeout=15000}={}) {
  const cached=readCache();
  if(!refresh && cached && Date.now()-cached.time<CACHE_TTL_MS) return {items:cached.items,mode:'cached',cachedAt:cached.time};
  const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),timeout);
  try {
    const response=await fetch(ANIIMO_PUBLIC_API,{mode:'cors',cache:'no-cache',signal:abort.signal,credentials:'omit',headers:{Accept:'application/json'}});
    if(!response.ok) throw Error(`HTTP ${response.status}`);
    const text=await response.text();
    if(text.length>12_000_000) throw Error('Catalog exceeds safe size');
    const items=normalizePublicCatalog(JSON.parse(text));
    if(items.length<30) throw Error('Unexpected catalog format or insufficient records');
    saveCache(items);
    return {items,mode:'live',cachedAt:Date.now()};
  } catch(error) {
    if(cached) return {items:cached.items,mode:'offline',cachedAt:cached.time,error:String(error.message)};
    return {items:[],mode:'unavailable',error:String(error.message)};
  } finally { clearTimeout(timer); }
}
function applyPublicCatalog(items,aniimo) {
  let added=0,matched=0;
  const byName=new Map(aniimo.map(a=>[a.name.toLowerCase(),a]));
  for(const record of items) {
    let item=byName.get(record.name.toLowerCase());
    const basic=record.forms.find(f=>/^basic$/i.test(f.name))??record.forms[0];
    if(!item){item={id:record.slug||record.name.toLowerCase().replace(/\s+/g,'-'),name:record.name,monogram:record.name.slice(0,2).toUpperCase(),index:Number(record.id)||aniimo.length+1,element:basic.elements[0]||'Lightning',role:basic.roles[0]||'Support'};aniimo.push(item);byName.set(record.name.toLowerCase(),item);added++;}
    else matched++;
    item.official=record;
    item.image=record.image;
    if(basic.elements.length) item.element=basic.elements[0];
    if(basic.roles.length) item.role=basic.roles[0];
  }
  aniimo.sort((a,b)=>(Number(a.official?.id)||a.index||99999)-(Number(b.official?.id)||b.index||99999)||a.name.localeCompare(b.name));
  return {added,matched};
}

const ROWS=[

 [1.6,.625,.625,1,.625,1.6,1,.625,1],
 [.625,1.6,.625,1,1,1.6,1,.625,1],

 [1,1,1,.625,1,1,1.6,.625,1.6],
 [1,.625,1.6,1.6,1,1,.625,1.6,1]
];
const TYPE_MATRIX=Object.fromEntries(ELEMENT_ORDER.map((name,i)=>[name,Object.fromEntries(ELEMENT_ORDER.map((def,j)=>[def,ROWS[i][j]]))]));
const normElement=value=>({Earth:'Rock',Electric:'Lightning',Holy:'Light'}[value]||value);
function multiplier(attacker,defending){
 const attack=normElement(attacker);
 if(!TYPE_MATRIX[attack])return 1;
 const defs=[...new Set((Array.isArray(defending)?defending:[defending]).map(normElement).filter(x=>TYPE_MATRIX[attack][x]!=null))].slice(0,2);

const discoveryKey = (species,form='Basic') => `${regionId(species)}::${regionId(form||'Basic')}`;

function safeKey(k){return typeof k==='string' && /^[a-z0-9-]{1,100}(::[a-z0-9-]{1,100})?$/.test(k)}
function normalizeExplorerProgress(raw){
 const data=safeObject(raw),visited={},discoveries={},wishlist=[];
 for(const [id,record] of Object.entries(safeObject(data.visited)).slice(0,200)){
  if(!safeKey(id)||id.includes('::'))continue;
  const item=safeObject(record);
  if(item.visited||typeof item.notes==='string')visited[id]={visited:!!item.visited,notes:String(item.notes??'').slice(0,350)};
 }
 for(const [id,status] of Object.entries(safeObject(data.discoveries)).slice(0,1200)){
  if(safeKey(id)&&id.includes('::')&&knownStatus.includes(status))discoveries[id]=status;
 }
 if(Array.isArray(data.wishlist))for(const id of data.wishlist.slice(0,300)){
  if(safeKey(id)&&id.includes('::')&&!wishlist.includes(id))wishlist.push(id);
 }
 return {version:1,visited,discoveries,wishlist};

function buildHabitatIndex(catalogItems=[],starters=STARTER_REGIONS,speciesIndex=[]){
 const regions=new Map();
 const register=(name,starter)=>{
  const id=canonicalRegionId(name);
  if(!id)return null;
  if(!regions.has(id))regions.set(id,{id,name:starter?.name||normalizeText(name),icon:starter?.icon||'✿',subtitle:starter?.subtitle||'New surroundings to explore',leads:[],source:'unlisted'});
  return regions.get(id);
 };
 for(const starter of starters)register(starter.name,starter);
 const seenKeys=new Set();
 for(const animal of Array.isArray(catalogItems)?catalogItems:[]){
  const species=normalizeText(animal?.name);
  if(!species||!Array.isArray(animal.forms))continue;
  for(const form of animal.forms){
   const name=normalizeText(form?.name||'Basic');
   for(const habitat of Array.isArray(form?.habitats)?form.habitats:[]){
    const region=register(habitat);if(!region)continue;
    const key=discoveryKey(species,name),rkey=region.id+'|'+key;
    if(seenKeys.has(rkey))continue;seenKeys.add(rkey);
    region.leads.push({key,species,form:name,elements:(form.elements||[]).slice(0,2),image:form.image||animal.image||'',source:'catalog'});
    region.source='catalog';
   }
  }
 }
 const byName=new Map((Array.isArray(speciesIndex)?speciesIndex:[]).map(x=>[String(x.name||'').toLowerCase(),x]));
 for(const starter of starters){
  const region=register(starter.name,starter);if(!region||region.leads.length)continue;
  for(const species of starter.leads||[]){
   const unit=byName.get(species.toLowerCase());
   const label=unit?.name||species;
   const key=discoveryKey(label,'Basic');
   if(region.leads.some(x=>x.key===key))continue;
   region.leads.push({key,species:label,form:'Basic',elements:[unit?.element].filter(Boolean),image:unit?.image||'',source:'starter'});
   region.source='starter';
  }
 }
 return [...regions.values()].map(region=>({...region,leads:region.leads.sort((a,b)=>a.species.localeCompare(b.species)||a.form.localeCompare(b.form))}))
   .sort((a,b)=>{
    const ai=starters.findIndex(x=>canonicalRegionId(x.name)===a.id),bi=starters.findIndex(x=>canonicalRegionId(x.name)===b.id);
    return (ai<0?1000:ai)-(bi<0?1000:bi)||a.name.localeCompare(b.name);
   });
}
function regionStats(region,progress,ownedInstances=[]){
 const p=normalizeExplorerProgress(progress),leads=region?.leads||[];
 const speciesCount=new Set(leads.map(x=>x.species)).size;
 const caught=leads.filter(x=>p.discoveries[x.key]==='caught'||ownedInstances.some(u=>discoveryKey(u.species,u.form)===x.key)).length;
 const seen=leads.filter(x=>p.discoveries[x.key]||ownedInstances.some(u=>discoveryKey(u.species,u.form)===x.key)).length;
 const planned=leads.filter(x=>p.wishlist.includes(x.key)).length;
 return {total:leads.length,species:speciesCount,caught,seen,planned,percent:leads.length?Math.round(caught/leads.length*100):0,visited:!!p.visited[region?.id]?.visited};
}
function planExpedition(regions,progress,ownedInstances=[],limit=5){
 const p=normalizeExplorerProgress(progress),results=[];
 for(const region of regions){
  const pending=(region.leads||[]).filter(x=>p.wishlist.includes(x.key)&&p.discoveries[x.key]!=='caught'&&!ownedInstances.some(u=>discoveryKey(u.species,u.form)===x.key));
  if(pending.length)results.push({id:region.id,name:region.name,icon:region.icon,pending,visited:!!p.visited[region.id]?.visited});
 }

}

function isPrismana(a){return a.official?.forms?.some(f=>/prismana/i.test(f.name))}
function variants(a){return a.official?.forms || []}
function filterAniimo(){const q=state.rosterQuery.trim().toLowerCase();return ANIIMO.filter(a=>{
 const fs=variants(a);
 const elementMatch=state.rosterFilter==='All'||a.element===state.rosterFilter||fs.some(f=>f.elements.includes(state.rosterFilter));
 const formMatch=state.formFilter==='All'||state.formFilter==='Prismana'&&isPrismana(a)||state.formFilter==='Multiple'&&fs.length>1||state.formFilter==='Basic'&&fs.length===1;
 const text=[a.name,a.official?.id,a.official?.portuguese,...fs.map(f=>f.name),...fs.flatMap(f=>f.habitats)].filter(Boolean).join(' ').toLowerCase();
 return elementMatch&&formMatch&&(!state.rosterOwned||owned(a.name))&&(!q||text.includes(q));
});}

function formCompare(a,current){const basic=a.official?.forms.find(f=>/^basic$/i.test(f.name))||a.official?.forms[0];if(!basic||basic.id===current.id)return '';
 const shared=['HP','ATK','BREAK','P.DEF','M.DEF','REGEN'];const delta=shared.map(st=>({stat:st,value:(basic.stats?.[st]!=null&&current.stats?.[st]!=null)?current.stats[st]-basic.stats[st]:null}));
 const gained=current.elements.filter(x=>!basic.elements.includes(x));const lost=basic.elements.filter(x=>!current.elements.includes(x));
 return `<div class="dex-comparison"><div class="section-kicker">FORM COMPARISON / VS BASIC</div><h4>${safe(current.name)} changes</h4><div class="dex-element-delta"><span>Basic: ${safe(basic.elements.join(' + ')||'Unknown')}</span><span>Selected: ${safe(current.elements.join(' + ')||'Unknown')}</span></div>${gained.length||lost.length?`<p class="dex-delta-caption">${gained.length?'Gains '+safe(gained.join(' / '))+' element':''}${gained.length&&lost.length?' · ':''}${lost.length?'Loses '+safe(lost.join(' / '))+' element':''}</p>`:''}<div class="dex-delta-grid">${delta.map(d=>`<div class="dex-delta ${d.value>0?'up':d.value<0?'down':''}"><small>${safe(d.stat)}</small><strong>${d.value===null?'—':d.value===0?'0':(d.value>0?'+':'')+d.value}</strong></div>`).join('')}</div><small>Base attribute differences only. They are not a calculation of final combat DPS, skill scaling, or build quality.</small></div>`;
}
