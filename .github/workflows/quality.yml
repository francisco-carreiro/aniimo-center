name: Wildbook quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate app and service worker
        run: |
          node --check assets/app.js
          node --check assets/live-data.js
          node --check service-worker.js
          node --test tests/*.test.mjs
      - name: Rebuild optimized assets
        run: |
          python scripts/optimize_css.py
          python scripts/build_standalone.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- assets/style.min.css ANIIMO-WILDBOOK.html ANIIMO-CENTER-standalone.html
