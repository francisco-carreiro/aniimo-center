  const r = { HP:num(v.hp ?? v.HP), ATK:num(v.atk ?? v.ATK), BREAK:num(v.brk ?? v.break ?? v.BREAK), 'P.DEF':num(v.pdef ?? v.pDef ?? v['P.DEF']), 'M.DEF':num(v.mdef ?? v.mDef ?? v['M.DEF']), REGEN:num(v.regen ?? v.REGEN) };

  r.total = num(v.total) ?? (complete.length===6 ? complete.reduce((a,b)=>a+b,0) : null);
  return r;
}

function normalizePublicCatalog(raw) {
  const list = Array.isArray(raw) ? raw : arr(raw?.aniimos ?? raw?.data?.aniimos ?? raw?.data ?? raw?.items ?? raw?.results);

  const unique=new Map();

    if(record && record.forms.length && !unique.has(record.name.toLowerCase())) unique.set(record.name.toLowerCase(),record);

function readCache() {

function saveCache(items) {

}
async function loadPublicCatalog({refresh=false,timeout=15000}={}) {
  const cached=readCache();
  if(!refresh && cached && Date.now()-cached.time<CACHE_TTL_MS) return {items:cached.items,mode:'cached',cachedAt:cached.time};
  const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),timeout);
  try {
    const response=await fetch(ANIIMO_PUBLIC_API,{mode:'cors',cache:'no-cache',signal:abort.signal,credentials:'omit',headers:{Accept:'application/json'}});
    if(!response.ok) throw Error(`HTTP ${response.status}`);
    const text=await response.text();
    if(text.length>12_000_000) throw Error('Catalog exceeds safe size');
    const items=normalizePublicCatalog(JSON.parse(text));
    if(items.length<30) throw Error('Unexpected catalog format or insufficient records');
    saveCache(items);
    return {items,mode:'live',cachedAt:Date.now()};
  } catch(error) {
    if(cached) return {items:cached.items,mode:'offline',cachedAt:cached.time,error:String(error.message)};

  } finally { clearTimeout(timer); }
}
function applyPublicCatalog(items,aniimo) {

  const byName=new Map(aniimo.map(a=>[a.name.toLowerCase(),a]));
  for(const record of items) {
    let item=byName.get(record.name.toLowerCase());
    const basic=record.forms.find(f=>/^basic$/i.test(f.name))??record.forms[0];
    if(!item){item={id:record.slug||record.name.toLowerCase().replace(/\s+/g,'-'),name:record.name,monogram:record.name.slice(0,2).toUpperCase(),index:Number(record.id)||aniimo.length+1,element:basic.elements[0]||'Lightning',role:basic.roles[0]||'Support'};aniimo.push(item);byName.set(record.name.toLowerCase(),item);added++;}
    else matched++;
    item.official=record;
    item.image=record.image;
    if(basic.elements.length) item.element=basic.elements[0];
    if(basic.roles.length) item.role=basic.roles[0];
  }
  aniimo.sort((a,b)=>(Number(a.official?.id)||a.index||99999)-(Number(b.official?.id)||b.index||99999)||a.name.localeCompare(b.name));
  return {added,matched};
}

function gradeTeam(names){const selected=names.map(getAniimo).filter(Boolean);const ref=TEAMS.find(t=>t.element===state.target);const roles=selected.map(a=>ref?.lineup.find(([name])=>name===a.name)?.[1]||a.role);const uniq=new Set(selected.map(a=>a.name));let issues=[];let pts=0;if(roles.includes('DPS'))pts+=20;else issues.push('No primary DPS');if(roles.includes('Break'))pts+=20;else issues.push('No dedicated breaker (some supports can BREAK)');if(roles.includes('Regen'))pts+=20;else issues.push('No REGEN role');if(roles.includes('Heal'))pts+=15;else issues.push('No dedicated healer');if(roles.includes('Support'))pts+=10;else issues.push('No explicit support role');pts+=Math.round(selected.length/4*10);if(uniq.size!==selected.length){issues.push('Duplicate Aniimo selected');pts=Math.max(0,pts-15)}let own=selected.filter(a=>owned(a.name)).length;pts+=Math.round(own/4*5);return {pts:Math.min(100,pts),issues,selected,own}}

tions"><button class="btn primary" data-analyze="team">${icon('chart',17)} Analyze composition</button><button class="btn secondary" data-clear="team">${icon('refresh',16)} Reset squad</button></div></section><section class="content-card tactical-panel"><span class="section-kicker">RESEARCH TEMPLATE</span><h3>${safe(rec.name)}</h3><p>${safe(rec.summary)}</p><div class="horizontal-members">${rec.lineup.map(([name,role])=>`<div>${avatar(getAniimo(name),'sm')}<span><strong>${safe(name)}</strong><small>${safe(role)}</small></span></div>`).join('')}</div><button class="text-action" data-team="${safe(rec.element)}">See full ${safe(rec.element)} strategy ${icon('arrow',15)}</button></section></div><div><div class="analysis-card"><div class="analysis-head"><span class="section-kicker">COMPOSITION CHECKLIST</span><span class="heuristic-badge">HEURISTIC</span></div><div class="analysis-score"><div class="score-ring" style="--score:${current.pts}"><div><strong>${current.pts}</strong><span>/100</span></div></div><div><h3>${current.pts>=80?'Well-rounded roles':current.pts>=55?'Some role gaps':'Needs revision'}</h3><p>Role coverage + owned readiness</p></div></div><div class="analysis-divider"></div><div class="analysis-row"><span>DPS carry</span><strong class="${current.selected.some(a=>a.role==='DPS')?'positive':'negative'}">${current.selected.some(a=>a.role==='DPS')?'COVERED':'MISSING'}</strong></div><div class="analysis-row"><span>BREAK</span><strong class="${current.selected.some(a=>a.role==='Break')?'positive':'negative'}">${current.selected.some(a=>a.role==='Break')?'COVERED':'REVIEW'}</strong></div><div class="analysis-row"><span>Energy / REGEN</span><strong class="${current.selected.some(a=>a.role==='Regen')?'positive':'negative'}">${current.selected.some(a=>a.role==='Regen')?'COVERED':'MISSING'}</strong></div><div class="analysis-row"><span>Healing</span><strong class="${current.selected.some(a=>a.role==='Heal')?'positive':'negative'}">${current.selected.some(a=>a.role= function sources(){return `${title('RESEARCH NETWORK / 006','Source <em>transparency.</em>','Game reference data refreshes from a public API; team and best-in-slot recommendations remain separately curated.',button('View builds','aniidex','btn primary'))}<div class="source-summary"><div>${icon('database',26)}<strong>${SOURCES.length+1}</strong><span>reference links</span></div><div>${icon('team',26)}<strong>09</strong><span>elemental presets</span></div><div>${icon('book',26)}<strong>${ANIIMO.length}</strong><span>indexed Aniimo</span></div><div>${icon('shield',26)}<strong>LOCAL</strong><span>personal data</span></div></div><section class="content-card"><div class="card-head"><span class="section-kicker">SOURCE REGISTRY</span><h3>Where recommendations come from</h3></div><div class="sources-table">${[{id:'official-api',name:'Aniimo Tools · Public JSON API',note:'Automatically refreshed official wiki-derived species, forms, traits, skills, images and habitats. No API key or account required.',category:'Live species encyclopedia',date:'Daily',url:ANIIMO_PUBLIC_INFO},...SOURCES].map(s=>`<div class="source-row"><div class="source-symbol">${icon('book',20)}</div><div><h4>${safe(s.name)}</h4><p>${safe(s.note)}</p><span class="source-cat">${safe(s.category)}</span></div><div class="source-date">${safe(s.date)}</div><a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer" title="Visit reference">${icon('external',19)}</a></div>`).join('')}</div></section><div class="secondary-grid"><section class="content-card"><span class="section-kicker">RELIABILITY POLICY</span><h3>How data is classified</h3><div class="reliability"><div><span class="reliability-mark confirmed"></span><strong>Detailed / source-backed</strong><p>Individual skill/item information checked against named guides or game-derived data.</p></div><div><span class="reliability-mark community"></span><strong>Community-tested</strong><p>Player builds and team lineups. Can vary by patch, encounter and equipment.</p></div><div><span class="reliability-mark template"></span><strong>Role template</strong><p>Generic ATK / REGEN / BREAK / HP advice; never presented as a verified creature-specific BIS setup.</p></div></div></section><section class="content-card"><span class="section-kicker">DATA OPERATIONS</span><h3>What updates automatically?</h3><p>The public Aniimo Tools JSON is fetched on a 12-hour refresh interval in your browser and cached locally when possible. Team and held-item recommendations are curated and do not update automatically. No account, proxy, or server is required.</p><div class="hint-block">${icon('info',18)} <span>Official species/forms are independently provided by <a href="https://aniimo.ogoulart.dev/api/" target="_blank" rel="noopener noreferrer">Aniimo Tools</a>. To edit build recommendations, update <code>assets/data.js</code>. Export personal progression anytime.</span></div><a class="inline-link" target="_blank" rel="noopener noreferrer" href="https://gamewith.ai/aniimo/en/articles/best-team-comps">Check the newest team guidance ${icon('external',16)}</a></section></div>`}
function render(keepScroll=false){const was=window.scrollY;document.querySelectorAll('.build-overlay').forEach(el=>el.remove());app.innerHTML=header()+({overview,teams:teamsPage,aniidex:library,items:itemsPage,progression,planner,collection,sources}[state.nav]||overview)()+footer();if(modal){document.body.insertAdjacentHTML('beforeend',buildDetail(modal));document.body.classList.add('modal-open')}else{document.body.classList.remove('modal-open')}if(keepScroll)requestAnimationFrame(()=>window.scrollTo(0,was));else requestAnimationFrame(()=>window.scrollTo(0,0))}

function downloadBackup(){const obj={format:'aniimo-center',version:1,exportedAt:new Date().toISOString(),collection:state.collection,favorite:state.favorite};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='aniimo-center-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);flash('Backup exported successfully.')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{if(file.size>2500000)throw new Error('File is too large');const b=JSON.parse(String(reader.result));if(b.format!=='aniimo-center'||b.version!==1||!b.collection||typeof b.collection!=='object'||Array.isArray(b.collection))throw new Error('Not a valid ANIIMO CENTER backup');const cleaned={};Object.entries(b.collection).forEach(([name,p])=>{if(typeof name!=='string'||!name.trim()||name.length>100||!p||typeof p!=='object'||Array.isArray(p))return;cleaned[name]={...clone(DEFAULT_PROFILE),owned:true,level:n(p.level,1,100,1),cp:n(p.cp,0,999999,0),star:n(p.star,0,12,0),spent:n(p.spent,0,200,0),budget:n(p.budget,0,200,5),potential:String(p.potential||'Unknown').slice(0,50),held:String(p.held||'').slice(0,120),notes:String(p.notes||'').slice(0,400),form:String(p.form||'Basic').slice(0,120),awaken:Object.fromEntries(STAT_NAMES.map(st=>[st,n(p.awaken?.[st],0,20,0)]))}});state.collection=cleaned;persist();render(true);flash(`Imported ${Object.keys(cleaned).length} owned Aniimo.`)}catch(err){flash('Import failed: '+err.message,'warn')}};reader.readAsText(file)}

document.addEventListener('change',e=>{const t=e.target;if(t.id==='roster-element'){state.rosterFilter=t.value;render(true)}if(t.id==='roster-form'){state.formFilter=t.value;render(true)}if(t.id==='progress-select'){state.selected=t.value;persist();render(true)}if(t.id==='team-preset'){state.target=t.value;state.teamNames=(TEAMS.find(a=>a.element===t.value)||TEAMS[0]).lineup.map(x=>x[0]);persist();render(true)}if(t.dataset.slot!==undefined){state.teamNames[Number(t.dataset.slot)]=t.value;persist();render(true)}});
document.addEventListener('input',e=>{if(e.target.id==='roster-search'){let active=e.target,idx=active.selectionStart;state.rosterQuery=active.value;const grid=document.querySelector('.library-grid');const summary=document.querySelector('.library-summary');if(!grid)return;let filtered=filterAniimo();grid.querySelectorAll('.library-card').forEach(card=>{const name=card.querySelector('[data-open]')?.dataset.open;card.style.display=filtered.some(a=>a.name===name)?'':'none'});if(summary)summary.querySelector('b').textContent=filtered.length;const emp=document.querySelector('.library-empty-search');if(emp)emp.remove();if(!filtered.length)grid.insertAdjacentHTML('afterend','<p class="library-empty-search muted">No matching Aniimo. Try a different search.</p>')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeBuild();document.body.classList.remove('menu-open')}});
async function refreshCatalog(refresh=false){catalog.status='loading';catalog.error='';if(state.nav==='aniidex')render(true);const result=await loadPublicCatalog({refresh});catalog.status='ready';catalog.mode=result.mode;catalog.items=result.items;catalog.cachedAt=result.cachedAt;catalog.error=result.error||'';if(result.items.length)applyPublicCatalog(result.items,ANIIMO);render(true);if(refresh)flash(result.items.length?`Indexed ${result.items.length} Aniimo (${result.mode}).`:'Public API unavailable. Showing starter catalog.',result.items.length?'info':'warn');}
render();
refreshCatalog();
</script></body></html>
